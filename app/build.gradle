plugins {
    id 'com.android.application'
}

android {
    namespace 'com.englishlistening.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.englishlistening.browser'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.0.1-Ultimate'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
